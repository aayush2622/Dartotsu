group 'com.dartotsu.dartotsu_image_rust'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

android {
    namespace 'com.dartotsu.dartotsu_image_rust'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"

cargokit {
    manifestDir = "../rust"
    libname = "dartotsu_image_rust"
}
