[package]
name = "dartotsu_image_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
vips = ["dep:vips"]

[dependencies]
fast_image_resize = { version = "5.1", features = ["image"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "avif",
    "gif",
    "bmp",
    "tiff",
    "ico",
    "qoi",
    "tga",
    "hdr",
] }
rayon = "1.10"
vips = { version = "0.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
