name: dartotsu
description: "An Anilist client"

publish_to: 'none'

# Application version and build number
version: 0.0.4+1

# Dart SDK constraints
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"
# Main dependencies
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  archive: ^4.3.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  # State Management
  get: ^4.7.3

  # Networking
  rhttp: ^0.18.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Local Storage
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  google_fonts: ^9.0.0
  cryptography: ^2.9.0
  crypto: ^3.0.7

  # UI Components
  introduction_screen: ^5.0.1
  flutter_animate: ^4.5.2
  cached_network_image: ^4.0.4
  precached_network_image: ^1.4.1
  flutter_svg: ^2.3.0
  flex_color_picker: ^4.0.0
  skeletonizer: ^3.0.0
  blurbox: ^0.0.6
  markdown_widget: ^2.3.2+8
  dpad: ^3.0.0
  dynamic_color: ^2.1.0
  # dynamic_color 2.x exposes material_ui's ColorScheme; see Core/ThemeManager/DynamicColorScheme.dart
  material_ui: ^1.5.0

  # UI Enhancements
  html: ^0.15.7
  intl: any

  # Platform Specific
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: main
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/universal/media_kit_libs_video
  window_manager: ^0.5.2
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.0.1
  wakelock_plus: ^1.6.1
  volume_controller: ^3.7.1
  screen_brightness: ^2.1.11
  app_links: ^7.2.1
  win32: ^6.4.0
  ffi: ^2.2.0
  install_plugin: ^2.1.0
  flutter_discord_rpc_fork:
    git:
      url: https://github.com/kodjodevf/flutter-discord-rpc.git
      ref: update_frb

  # Miscellaneous
  receive_sharing_intent: ^1.9.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  collection: ^1.19.1
  webview_all: ^1.4.4
  flutter_web_auth_2:
    #path : ../flutter_web_auth/flutter_web_auth_2
    git:
      url: https://github.com/aayush2622/flutter_web_auth.git
      ref: master
      path: flutter_web_auth_2
  dartotsu_extension_bridge:
    path: ../DartotsuExtensionBridge
  sizer: ^3.1.3
    #git:
      #url: https://github.com/aayush2622/DartotsuExtensionBridge.git
      #ref: master


# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

  # Code Generation dart run build_runner build
  isar_community_generator: ^3.3.2
  json_serializable: ^6.11.2
  build_runner: ^2.15.1
  inno_bundle: ^0.12.0

dependency_overrides:
  collection: ^1.19.1
  media_kit:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/universal/media_kit_libs_video
  media_kit_libs_linux:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/linux/media_kit_libs_linux


flutter:
  uses-material-design: true
  generate: true
  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins.ttf
        - asset: assets/fonts/poppins_bold.ttf
          weight: 700
        - asset: assets/fonts/poppins_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/poppins_thin.ttf
          weight: 100
    - family: Poppins-SemiBold
      fonts:
        - asset: assets/fonts/poppins_semi_bold.ttf

  # Assets
  assets:
    - .env
    - assets/images/logo.png
    - assets/svg/
# Flutter Launcher Icons Configuration
# dart run flutter_launcher_icons
flutter_icons:
  ios: true
  image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/logo.png"

inno_bundle:
  sign_tool:
    command: $p
  id: 609d9fb9-ac99-533b-a5b5-f277afa99b68
  publisher: Ankit Grai
  name: Dartotsu
  version: 0.0.4
  admin: auto
  installer_icon: assets/images/lol.ico
  languages:
    - english
