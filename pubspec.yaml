name: dartotsu
description: "An Anilist client"

publish_to: 'none'

# Application version and build number
version: 1.1.1

# Dart SDK constraints
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"
# Main dependencies
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  archive: ^4.5.2
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_analytics: ^13.0.0
  # State Management
  get: ^4.7.3

  # Networking
  rhttp: ^0.18.0

  # Rust Image Processing & libvips
  dartotsu_image_rust:
    git:
      url: https://github.com/itsmechinmoy/dartotsu_image_rust.git
      ref: main

  # JSON Serialization
  json_annotation: ^4.12.0

  # Local Storage
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6
  path: ^1.9.1
  image: ^4.12.0
  google_fonts: ^9.0.0
  cryptography: ^2.9.0
  crypto: ^3.0.7

  # UI Components
  introduction_screen: ^5.0.1
  flutter_animate: ^4.5.2
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.4.6
  precached_network_image: ^1.4.1
  flutter_svg: ^2.3.2
  skeletonizer: ^3.0.0
  blurbox: ^0.0.6
  markdown_widget: ^2.3.2+8
  dpad: ^3.1.1
  dynamic_color: ^2.1.0
  # dynamic_color 2.x exposes material_ui's ColorScheme; see Core/ThemeManager/DynamicColorScheme.dart
  material_ui: ^1.8.0

  # UI Enhancements
  html: ^0.15.7
  intl: any

  # Platform Specific
  media_kit:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/universal/media_kit_libs_video

  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  dbus: ^0.7.15
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.3
  wakelock_plus: ^1.8.0
  flutter_media_session: ^3.0.9
  fl_pip: ^3.2.3
  volume_controller: ^3.7.1
  screen_brightness:
    git:
      url: https://github.com/aayush2622/screen_brightness.git
      ref: linux-support
      path: screen_brightness
  app_links: ^7.2.2
  win32: ^6.4.0
  ffi: ^2.2.0
  install_plugin: ^2.1.0
  dart_discord_presence: ^1.2.2


  # Miscellaneous
  receive_sharing_intent: ^1.9.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  collection: ^1.19.1
  webview_all: ^1.4.4
  flutter_web_auth_2:
    #path : ../flutter_web_auth/flutter_web_auth_2
    git:
      url: https://github.com/aayush2622/flutter_web_auth.git
      ref: fix/webview-dialog-clip
      path: flutter_web_auth_2
  dartotsu_extension_bridge:
    #path: ../DartotsuExtensionBridge
    git:
      url: https://github.com/aayush2622/DartotsuExtensionBridge.git
      ref: master
  sizer: ^3.1.3
  connectivity_plus: ^7.3.1
  xml: ^6.6.1
  flutter_displaymode: ^0.7.0
  flutter_tts: ^4.2.5
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  pdfrx: ^2.11.0

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation dart run build_runner build
  isar_community_generator: ^3.4.1
  json_serializable: ^6.15.2
  build_runner: ^2.15.1
  inno_bundle: ^0.12.0

dependency_overrides:
  collection: ^1.19.1
  media_kit:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/universal/media_kit_libs_video
  media_kit_libs_linux:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/linux/media_kit_libs_linux
  media_kit_libs_ios_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/ios/media_kit_libs_ios_video
  media_kit_libs_android_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/android/media_kit_libs_android_video
  media_kit_libs_windows_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/windows/media_kit_libs_windows_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/macos/media_kit_libs_macos_video
  media_kit_libs_ohos:
    git:
      url: https://github.com/aayush2622/media-kit.git
      ref: main
      path: ./libs/ohos/media_kit_libs_ohos



flutter:
  uses-material-design: true
  generate: true
  # Fonts
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope.ttf
        - asset: assets/fonts/manrope_medium.ttf
          weight: 500
        - asset: assets/fonts/manrope_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/manrope_bold.ttf
          weight: 700

  # Assets
  assets:
    - .env
    - assets/images/logo.png
    - assets/svg/


inno_bundle:
  sign_tool:
    command: $p
  id: 609d9fb9-ac99-533b-a5b5-f277afa99b68
  publisher: Ankit Grai
  name: Dartotsu
  admin: auto
  installer_icon: assets/images/lol.ico
  languages:
    - english


