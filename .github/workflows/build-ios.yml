name: Build iOS
on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        required: true
      clean-build:
        type: boolean
        required: false
        default: false
      publish-mode:
        type: string
        required: false
        default: gdrive
    outputs:
      ipa_link:
        description: Drive web content link
        value: ${{ jobs.build.outputs.ipa_link }}
    secrets:
      FLUTTER_VERSION:
        required: false
      GOOGLE_FOLDER_MAIN:
        required: false
      GOOGLE_KEY:
        required: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    outputs:
      ipa_link: ${{ steps.gdriveUpload.outputs.web-content-link }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter env
        uses: ./.github/actions/setup-flutter-env
        with:
          flutter-version: ${{ inputs.flutter-version }}
          flutter-version-secret: ${{ secrets.FLUTTER_VERSION }}

      - name: Clean build (optional)
        if: ${{ inputs.clean-build || contains(github.event.head_commit.message || '', '[clean]') }}
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Install the iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
          for plist in build/ios/iphoneos/Runner.app/Frameworks/*.framework/Info.plist; do
            min=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$plist" 2>/dev/null || true)
            if [ -n "$min" ] && [ "${min%%.*}" -gt 15 ]; then
              /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$plist"
            fi
          done
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cd Payload
          cp -R ../Runner.app .
          cd ..
          zip -r "Dartotsu-iOS-${SAFE_REF}.ipa" Payload
        env:
          SAFE_REF: ${{ env.SAFE_REF }}

      - name: Upload iOS artifact
        if: ${{ inputs.publish-mode == 'artifact' || inputs.publish-mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/Dartotsu-iOS-${{ env.SAFE_REF }}.ipa
          if-no-files-found: error

      - name: Upload File To Google Drive
        if: ${{ (inputs.publish-mode == 'gdrive' || inputs.publish-mode == 'both') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        id: gdriveUpload
        uses: hoatruongdev09/google-drive-file-upload-github-action@v1.1
        with:
          file-path: build/ios/iphoneos/Dartotsu-iOS-${{ env.SAFE_REF }}.ipa
          upload-name: Dartotsu-iOS-${{ env.SAFE_REF }}.ipa
          upload-to-folder-id: ${{ secrets.GOOGLE_FOLDER_MAIN }}
          service-account-json: "${{ secrets.GOOGLE_KEY }}"
          overrwrite: true
