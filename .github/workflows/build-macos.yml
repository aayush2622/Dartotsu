name: Build macOS
on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        required: true
      clean-build:
        type: boolean
        required: false
        default: false
      publish-mode:
        type: string
        required: false
        default: gdrive
      xcode-version:
        type: string
        required: false
        default: "26.3"
    outputs:
      dmg_link:
        description: Drive web content link
        value: ${{ jobs.build.outputs.dmg_link }}
    secrets:
      FLUTTER_VERSION:
        required: false
      SIMKL_SECRET:
        required: false
      GOOGLE_FOLDER_MAIN:
        required: false
      GOOGLE_KEY:
        required: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      dmg_link: ${{ steps.gdriveUpload.outputs.web-content-link }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter env
        uses: ./.github/actions/setup-flutter-env
        with:
          flutter-version: ${{ inputs.flutter-version }}
          flutter-version-secret: ${{ secrets.FLUTTER_VERSION }}
          simkl-secret: ${{ secrets.SIMKL_SECRET }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Clean build (optional)
        if: ${{ inputs.clean-build || contains(github.event.head_commit.message || '', '[clean]') }}
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG file for macOS Build
        shell: bash
        run: |
          mkdir -p build/macos/Release
          hdiutil create -volname "Dartotsu" \
            -srcfolder build/macos/Build/Products/Release/Dartotsu.app \
            -ov -format UDZO \
            "build/macos/Release/Dartotsu-macos-${SAFE_REF}.dmg"
        env:
          SAFE_REF: ${{ env.SAFE_REF }}

      - name: Upload macOS artifact
        if: ${{ inputs.publish-mode == 'artifact' || inputs.publish-mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/Release/Dartotsu-macos-${{ env.SAFE_REF }}.dmg
          if-no-files-found: error

      - name: Upload File To Google Drive
        if: ${{ (inputs.publish-mode == 'gdrive' || inputs.publish-mode == 'both') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        id: gdriveUpload
        uses: hoatruongdev09/google-drive-file-upload-github-action@v1.1
        with:
          file-path: build/macos/Release/Dartotsu-macos-${{ env.SAFE_REF }}.dmg
          upload-name: Dartotsu-macos-${{ env.SAFE_REF }}.dmg
          upload-to-folder-id: ${{ secrets.GOOGLE_FOLDER_MAIN }}
          service-account-json: "${{ secrets.GOOGLE_KEY }}"
          overrwrite: true
