name: Dartotsu Build Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_targets:
        description: "Select platforms to build"
        required: true
        type: choice
        options:
          - "all"
          - "android"
          - "windows"
          - "linux"
          - "ios"
          - "macos"
      clean_build:
        description: "Clean build?"
        required: false
        type: boolean
        default: false
      ping_discord:
        description: "Ping Discord role?"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run? (Skip GitHub release, Discord, Nix push)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  prune_caches:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prune stale Actions caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLUTTER_VERSION: "3.50.0"
        run: bash scripts/ci/prune-actions-cache.sh

  build_android:
    needs: prune_caches
    if: |
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build.apk]') || contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build.all]'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_targets == 'android' || inputs.build_targets == 'all'))
    uses: ./.github/workflows/build-android.yml
    with:
      flutter-version: "3.50.0"
      clean-build: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build || false }}
      publish-mode: artifact
      universal-name: universal
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}
      APK_SIGN: ${{ secrets.APK_SIGN }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

  build_windows:
    needs: prune_caches
    if: |
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build.windows]') || contains(github.event.head_commit.message, '[build.all]'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_targets == 'windows' || inputs.build_targets == 'all'))
    uses: ./.github/workflows/build-windows.yml
    with:
      flutter-version: "3.50.0"
      clean-build: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build || false }}
      publish-mode: artifact
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}
      PFX_FILE: ${{ secrets.PFX_FILE }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

  build_linux:
    needs: prune_caches
    if: |
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build.linux]') || contains(github.event.head_commit.message, '[build.all]') || contains(github.event.head_commit.message, '[build]'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_targets == 'linux' || inputs.build_targets == 'all'))
    uses: ./.github/workflows/build-linux.yml
    with:
      flutter-version: "3.50.0"
      clean-build: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build || false }}
      publish-mode: artifact
      zip-name-prefix: Dartotsu_Linux
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}

  build_ios:
    needs: prune_caches
    if: |
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build.ios]') || contains(github.event.head_commit.message, '[build.all]'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_targets == 'ios' || inputs.build_targets == 'all'))
    uses: ./.github/workflows/build-ios.yml
    with:
      flutter-version: "3.50.0"
      clean-build: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build || false }}
      publish-mode: artifact
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}

  build_macos:
    needs: prune_caches
    if: |
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build.macos]') || contains(github.event.head_commit.message, '[build.all]'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_targets == 'macos' || inputs.build_targets == 'all'))
    uses: ./.github/workflows/build-macos.yml
    with:
      flutter-version: "3.50.0"
      clean-build: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build || false }}
      publish-mode: artifact
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}

  publish_alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build_android, build_windows, build_linux, build_ios, build_macos]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.build_android.result == 'success' ||
       needs.build_windows.result == 'success' ||
       needs.build_linux.result == 'success' ||
       needs.build_ios.result == 'success' ||
       needs.build_macos.result == 'success')
    permissions:
      contents: read
      actions: read
    outputs:
      alpha_version: ${{ steps.nix_hash.outputs.alpha_version }}
      alpha_url: ${{ steps.nix_hash.outputs.alpha_url }}
      alpha_hash: ${{ steps.nix_hash.outputs.alpha_hash }}
      commit_logs: ${{ steps.commit_logs.outputs.commit_logs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download last SHA artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: dart.yml
          name: last-sha
        continue-on-error: true

      - name: Get Commits Since Last Run
        id: commit_logs
        run: |
          if [ -f last_sha.txt ]; then
            LAST_SHA=$(cat last_sha.txt)
          else
            LAST_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Commits since $LAST_SHA:"
          COMMIT_LOGS=$(git log $LAST_SHA..HEAD --pretty=format:"● %s ~%an [֍](https://github.com/${{ github.repository }}/commit/%H)" --max-count=10)
          COMMIT_LOGS="${COMMIT_LOGS//'%'/'%25'}"
          COMMIT_LOGS="${COMMIT_LOGS//$'\n'/'%0A'}"
          COMMIT_LOGS="${COMMIT_LOGS//$'\r'/'%0D'}"
          echo "COMMIT_LOG=${COMMIT_LOGS}" >> $GITHUB_ENV
          echo "$COMMIT_LOGS"
          echo "commit_logs=${COMMIT_LOGS}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Save Current SHA for Next Run
        if: github.event_name == 'push' || inputs.dry_run != true
        run: echo ${{ github.sha }} > last_sha.txt

      - name: Upload Current SHA as Artifact
        if: github.event_name == 'push' || inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: last-sha
          path: last_sha.txt

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts
          merge-multiple: true

      - name: Prepare and normalize release artifacts
        id: prep_artifacts
        run: |
          mkdir -p release-assets
          find raw-artifacts -type f

          TAG="${GITHUB_SHA:0:7}"
          echo "TAG=${TAG}" >> $GITHUB_ENV

          # Windows installer -> Dartotsu_windows.exe
          win_installer=$(find raw-artifacts -type f -name "*Installer.exe" | head -n1)
          if [ -n "$win_installer" ]; then
            cp "$win_installer" release-assets/Dartotsu_windows.exe
            echo "win_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/Dartotsu_windows.exe" >> "$GITHUB_OUTPUT"
          fi

          # Linux zip -> Dartotsu_linux.zip
          linux_zip=$(find raw-artifacts -type f -name "Dartotsu_Linux_*.zip" | head -n1)
          if [ -n "$linux_zip" ]; then
            cp "$linux_zip" release-assets/Dartotsu_linux.zip
            echo "linux_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/Dartotsu_linux.zip" >> "$GITHUB_OUTPUT"
          fi

          # Android APKs
          apk_arm64=$(find raw-artifacts -type f -name "Dartotsu_Android_arm64-v8a_*.apk" | head -n1)
          if [ -n "$apk_arm64" ]; then
            base_arm64=$(basename "$apk_arm64")
            cp "$apk_arm64" "release-assets/$base_arm64"
            echo "apk_arm64_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/${base_arm64}" >> "$GITHUB_OUTPUT"
          fi

          apk_armv7=$(find raw-artifacts -type f -name "Dartotsu_Android_armeabi-v7a_*.apk" | head -n1)
          if [ -n "$apk_armv7" ]; then
            base_armv7=$(basename "$apk_armv7")
            cp "$apk_armv7" "release-assets/$base_armv7"
            echo "apk_armv7_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/${base_armv7}" >> "$GITHUB_OUTPUT"
          fi

          apk_x86_64=$(find raw-artifacts -type f -name "Dartotsu_Android_x86_64_*.apk" | head -n1)
          if [ -n "$apk_x86_64" ]; then
            base_x86_64=$(basename "$apk_x86_64")
            cp "$apk_x86_64" "release-assets/$base_x86_64"
            echo "apk_x86_64_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/${base_x86_64}" >> "$GITHUB_OUTPUT"
          fi

          apk_universal=$(find raw-artifacts -type f -name "Dartotsu_Android_universal_*.apk" | head -n1)
          if [ -n "$apk_universal" ]; then
            base_universal=$(basename "$apk_universal")
            cp "$apk_universal" "release-assets/$base_universal"
            cp "$apk_universal" release-assets/Dartotsu_main.apk
            echo "apk_universal_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/${base_universal}" >> "$GITHUB_OUTPUT"
            echo "apk_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/Dartotsu_main.apk" >> "$GITHUB_OUTPUT"
          fi

          for apk in raw-artifacts/Dartotsu_Android_*.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk")
              cp "$apk" "release-assets/$base"
            fi
          done

          # macOS DMG
          macos_dmg=$(find raw-artifacts -type f -name "Dartotsu-macos-*.dmg" | head -n1)
          if [ -n "$macos_dmg" ]; then
            cp "$macos_dmg" release-assets/Dartotsu-macos-main.dmg
            echo "macos_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/Dartotsu-macos-main.dmg" >> "$GITHUB_OUTPUT"
          fi

          # iOS IPA
          ios_ipa=$(find raw-artifacts -type f -name "Dartotsu-iOS-*.ipa" | head -n1)
          if [ -n "$ios_ipa" ]; then
            cp "$ios_ipa" release-assets/Dartotsu-iOS-main.ipa
            echo "ios_link=https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/Dartotsu-iOS-main.ipa" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Normalized Release Assets ==="
          ls -lh release-assets

      - name: Install Nix
        if: hashFiles('release-assets/Dartotsu_linux.zip') != ''
        uses: DeterminateSystems/nix-installer-action@main

      - name: Calculate Nix SRI Hash
        id: nix_hash
        if: hashFiles('release-assets/Dartotsu_linux.zip') != ''
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA:0:7}"
          zip_path="$PWD/release-assets/Dartotsu_linux.zip"

          base32_hash="$(nix-prefetch-url --unpack --type sha256 "file://${zip_path}" 2>/dev/null | tail -n1)"
          sri_hash="$(nix hash to-sri --type sha256 "$base32_hash" 2>/dev/null || nix hash convert --hash-algo sha256 --to sri "$base32_hash")"
          alpha_url="https://github.com/grayankit/Dartotsu-Downloader/releases/download/${TAG}/Dartotsu_linux.zip"

          echo "Computed SRI Hash: ${sri_hash}"
          echo "alpha_version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "alpha_url=${alpha_url}" >> "$GITHUB_OUTPUT"
          echo "alpha_hash=${sri_hash}" >> "$GITHUB_OUTPUT"

      - name: Publish Release to grayankit/Dartotsu-Downloader
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADER_TRIGGER_TOKEN_SHEBY }}
          TAG: ${{ env.TAG }}
          COMMIT_LOG: ${{ env.COMMIT_LOG }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          BODY=$(printf "## Alpha release for %s\n\n%b" "$TAG" "${COMMIT_LOG//'%0A'/$'\n'}")

          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would create/update release $TAG on grayankit/Dartotsu-Downloader with assets:"
            ls -lh release-assets
            echo "[DRY RUN] Release body preview:"
            echo "$BODY"
          else
            if gh release view "$TAG" --repo grayankit/Dartotsu-Downloader >/dev/null 2>&1; then
              gh release edit "$TAG" --repo grayankit/Dartotsu-Downloader --title "$TAG" --notes "$BODY" --latest --prerelease=false
            else
              gh release create "$TAG" --repo grayankit/Dartotsu-Downloader --title "$TAG" --notes "$BODY" --latest
            fi

            gh release upload "$TAG" release-assets/* --repo grayankit/Dartotsu-Downloader --clobber
            echo "Release $TAG published successfully."
          fi

      - name: Discord Notification
        if: github.event_name == 'push' || inputs.dry_run != true || inputs.ping_discord == true
        env:
          COMMIT_LOG: ${{ env.COMMIT_LOG }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PING_VARIABLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ping_discord) && '<@&1434448534450606090>' || 'noPing' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APK_ARM64_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.apk_arm64_link }}
          APK_ARMV7_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.apk_armv7_link }}
          APK_X86_64_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.apk_x86_64_link }}
          APK_UNIVERSAL_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.apk_universal_link }}
          APK_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.apk_link }}
          WINDOWS_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.win_link }}
          LINUX_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.linux_link }}
          IOS_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.ios_link }}
          MACOS_DOWNLOAD_LINK: ${{ steps.prep_artifacts.outputs.macos_link }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would send Discord notifications:"
            echo "APK arm64 Link: ${APK_ARM64_DOWNLOAD_LINK:-none}"
            echo "APK armv7 Link: ${APK_ARMV7_DOWNLOAD_LINK:-none}"
            echo "APK x86_64 Link: ${APK_X86_64_DOWNLOAD_LINK:-none}"
            echo "APK Universal Link: ${APK_UNIVERSAL_DOWNLOAD_LINK:-none}"
            echo "Windows Link: ${WINDOWS_DOWNLOAD_LINK:-none}"
            echo "Linux Link: ${LINUX_DOWNLOAD_LINK:-none}"
            echo "iOS Link: ${IOS_DOWNLOAD_LINK:-none}"
            echo "macOS Link: ${MACOS_DOWNLOAD_LINK:-none}"
          else
            bash scripts/ci/discord_alpha_embed.sh
            sleep 2
            bash scripts/ci/discord_alpha_links.sh
          fi

  update_nix_alpha:
    needs: [publish_alpha]
    if: |
      always() &&
      needs.publish_alpha.result == 'success' &&
      (github.event_name == 'push' || inputs.dry_run != true) &&
      needs.publish_alpha.outputs.alpha_hash != ''
    permissions:
      contents: write
    uses: ./.github/workflows/update-nix-channels.yml
    with:
      alpha_version: ${{ needs.publish_alpha.outputs.alpha_version }}
      alpha_url: ${{ needs.publish_alpha.outputs.alpha_url }}
      alpha_hash: ${{ needs.publish_alpha.outputs.alpha_hash }}
