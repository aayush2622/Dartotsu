name: RELEASE
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only (skip GH release, changelog push, Discord)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  build_android:
    uses: ./.github/workflows/build-android.yml
    with:
      flutter-version: "3.47.4"
      clean-build: false
      publish-mode: artifact
      universal-name: Universal
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}
      APK_SIGN: ${{ secrets.APK_SIGN }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

  build_windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      flutter-version: "3.47.4"
      clean-build: false
      publish-mode: artifact
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}
      PFX_FILE: ${{ secrets.PFX_FILE }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

  build_linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      flutter-version: "3.47.4"
      clean-build: false
      publish-mode: artifact
      zip-name-prefix: Dartotsu_LinuxZip
      build-appimage: true
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}

  build_ios:
    uses: ./.github/workflows/build-ios.yml
    with:
      flutter-version: "3.47.4"
      clean-build: false
      publish-mode: artifact
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}

  build_macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      flutter-version: "3.47.4"
      clean-build: false
      publish-mode: artifact
    secrets:
      FLUTTER_VERSION: ${{ secrets.FLUTTER_VERSION }}

  publish_release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build_android, build_windows, build_linux, build_ios, build_macos]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.build_android.result == 'success' ||
       needs.build_windows.result == 'success' ||
       needs.build_linux.result == 'success' ||
       needs.build_ios.result == 'success' ||
       needs.build_macos.result == 'success') &&
      (github.event_name == 'push' || inputs.dry_run != true)
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Generate changelog
        run: |
          echo "" > CHANGELOG.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:'%h %s' | tr '\n' '|')
          FEATURES=""; BUG_FIXES=""; REFACTORS=""; STYLE_CHANGES=""; PERFORMANCE=""; CHORES=""
          REPO_URL="https://github.com/${{ github.repository }}"
          IFS='|' read -ra COMMIT_LIST <<< "$COMMITS"
          for LINE in "${COMMIT_LIST[@]}"; do
            [[ -z "$LINE" ]] && continue
            HASH=$(echo "$LINE" | awk '{print $1}')
            MESSAGE=$(echo "$LINE" | cut -d' ' -f2-)
            LINK="[$HASH]($REPO_URL/commit/$HASH)"
            FORMATTED_COMMIT="* $LINK: $MESSAGE"
            if [[ $MESSAGE == feat* ]]; then FEATURES+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == fix* || $MESSAGE == bug* || $MESSAGE == improvement* || $MESSAGE == patch* ]]; then BUG_FIXES+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == refactor* ]]; then REFACTORS+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == style* ]]; then STYLE_CHANGES+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == perf* ]]; then PERFORMANCE+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == chore* || $MESSAGE == docs* || $MESSAGE == build* || $MESSAGE == ci* ]]; then CHORES+="$FORMATTED_COMMIT\n"
            fi
          done
          if [ -n "$FEATURES" ]; then echo "### 🎉 New Features" >> CHANGELOG.md; echo -e "$FEATURES" >> CHANGELOG.md; fi
          if [ -n "$BUG_FIXES" ]; then echo "### 🛠️ Bug Fixes & Improvements" >> CHANGELOG.md; echo -e "$BUG_FIXES" >> CHANGELOG.md; fi
          if [ -n "$REFACTORS" ]; then echo "### 🔧 Refactors" >> CHANGELOG.md; echo -e "$REFACTORS" >> CHANGELOG.md; fi
          if [ -n "$STYLE_CHANGES" ]; then echo "### 🎨 Style Changes" >> CHANGELOG.md; echo -e "$STYLE_CHANGES" >> CHANGELOG.md; fi
          if [ -n "$PERFORMANCE" ]; then echo "### 🚀 Performance Improvements" >> CHANGELOG.md; echo -e "$PERFORMANCE" >> CHANGELOG.md; fi
          if [ -n "$CHORES" ]; then echo "### 🧹 Chores & Documentation" >> CHANGELOG.md; echo -e "$CHORES" >> CHANGELOG.md; fi

      - name: Generate Fastlane changelog (IzzyOnDroid)
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          awk '/^### 🎉 New Features/{flag=1; next}/^### 🔧 Refactors/{flag=0}flag' CHANGELOG.md \
            | sed -E 's/!\[[^]]*\]\([^)]*\)//g; s/\[[^]]*\]\([^)]*\)//g; s/^\*[[:space:]]+/-/; s/^\s+//; /^$/d' \
            > fastlane/metadata/android/en-US/changelogs/default.txt || true
          cat fastlane/metadata/android/en-US/changelogs/default.txt || echo "No fastlane changelog"

      - name: Commit and push changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add CHANGELOG.md fastlane/metadata/android/en-US/changelogs/default.txt
          git commit -m "Update changelog for version ${{ github.ref_name }}" || echo "No changes to commit"
          git fetch origin main
          git push origin HEAD:main || {
            echo "Direct push failed, retrying with rebase..."
            git stash
            git pull --rebase origin main
            git stash pop || true
            git add CHANGELOG.md fastlane/metadata/android/en-US/changelogs/default.txt
            git commit -m "Update changelog for version ${{ github.ref_name }}" || echo "No changes to commit"
            git push origin HEAD:main
          }

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release-artifacts/**
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

  update_nix_channels:
    needs: [publish_release]
    if: |
      needs.publish_release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.dry_run != true)
    permissions:
      contents: write
    uses: ./.github/workflows/update-nix-channels.yml

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build_linux, publish_release]
    if: |
      always() &&
      needs.publish_release.result == 'success' &&
      needs.build_linux.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.dry_run != true)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: .

      - name: Generate PKGBUILD
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          MAINTAINER: ${{ github.repository_owner }}
        run: |
          APPIMAGE_FILE=$(find . -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "Error: AppImage file not found!" >&2
            exit 1
          fi
          APPIMAGE_NAME=$(basename "$APPIMAGE_FILE")
          HASH=$(sha256sum "$APPIMAGE_FILE" | awk '{print $1}')
          PKGVER="${VERSION#v}"
          PKGVER="${PKGVER//-/_}"

          cat > PKGBUILD << EOF
          # Maintainer: ${MAINTAINER}
          _pkgname=dartotsu
          _PkgName=Dartotsu
          pkgname=\${_pkgname}-bin
          pkgver=${PKGVER}
          pkgrel=1
          arch=(x86_64)
          pkgdesc='The Ultimate Anime & Manga Experience'
          url="https://github.com/aayush2622/\${_PkgName}"
          license=('GPL-3.0-or-later')
          provides=(\${_pkgname}=\${pkgver})
          depends=('libepoxy' 'gdk-pixbuf2' 'pango' 'webkit2gtk-4.1' 'harfbuzz' 'libsoup3' 'glibc' 'fontconfig' 'cairo' 'hicolor-icon-theme' 'glib2' 'gcc-libs' 'mpv' 'zlib-ng-compat' 'gtk3' 'at-spi2-core' 'libsecret')
          conflicts=(dartotsu)
          _appimage="\${_PkgName}-\${pkgver}.AppImage"
          source=("\${_appimage}::https://github.com/${REPO}/releases/download/${VERSION}/${APPIMAGE_NAME}"
                  "LICENSE-\${pkgver}.md::https://raw.githubusercontent.com/${REPO}/refs/tags/${VERSION}/LICENSE.md")
          noextract=(\${_appimage})
          sha256sums=('${HASH}' 'SKIP')

          prepare() {
              chmod +x "\${_appimage}"
              ./"\${_appimage}" --appimage-extract >/dev/null
          }

          build() {
              chmod -R a-x+rX squashfs-root/usr
              chmod +x squashfs-root/usr/bin/dartotsu
              if [ -f squashfs-root/usr/bin/dartotsu.bin ]; then
                  chmod +x squashfs-root/usr/bin/dartotsu.bin
              fi
          }

          package() {
              install -dm755 "\${pkgdir}/usr/"
              mv "\${srcdir}"/squashfs-root/usr/* "\${pkgdir}/usr/"
              install -Dm644 "\${srcdir}/LICENSE-\${pkgver}.md" "\${pkgdir}/usr/share/licenses/\${pkgname}/LICENSE.md"
              if [ -f "\${srcdir}/squashfs-root/dartotsu.png" ]; then
                  install -Dm644 "\${srcdir}/squashfs-root/dartotsu.png" "\${pkgdir}/usr/share/pixmaps/\${_pkgname}.png"
                  install -Dm644 "\${srcdir}/squashfs-root/dartotsu.png" "\${pkgdir}/usr/share/icons/hicolor/256x256/apps/\${_pkgname}.png"
              fi
              install -Dm644 /dev/stdin "\${pkgdir}/usr/share/applications/\${_pkgname}.desktop" <<DESKTOP
          [Desktop Entry]
          Version=\${pkgver}
          Type=Application
          Name=\${_PkgName}
          GenericName=\${_PkgName}
          Comment=\${pkgdesc}
          Exec=\${_pkgname} %U
          Icon=\${_pkgname}
          Terminal=false
          Categories=AudioVideo;Player;
          Keywords=\${_pkgname};anime;manga;novel
          StartupWMClass=ani.aayush262.dartotsu
          MimeType=video/mp4;video/x-matroska;video/webm;audio/mpeg;audio/flac;x-scheme-handler/dartotsu;x-scheme-handler/dar;x-scheme-handler/anymex;x-scheme-handler/sugoireads;x-scheme-handler/mangayomi;x-scheme-handler/aniyomi;x-scheme-handler/tachiyomi;x-scheme-handler/ireader;x-scheme-handler/legado;x-scheme-handler/yuedu;
          StartupNotify=true
          DESKTOP
          }
          EOF
          cat PKGBUILD

      - name: Publish AUR package
        continue-on-error: true
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: dartotsu-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME || github.actor }}
          commit_email: ${{ secrets.AUR_EMAIL || format('{0}@users.noreply.github.com', github.actor) }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

  post-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [publish_release]
    if: |
      needs.publish_release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.dry_run != true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest tag and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "LATEST_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          RELEASE_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}")
          RELEASE_NOTES=$(echo "$RELEASE_DATA" | jq -r '.body // empty')
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASE_URL }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
          LATEST_TAG: ${{ env.LATEST_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/discord_release_notes.sh

  upload_download_url:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [post-release-notes]
    if: needs.post-release-notes.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch release asset links
        env:
          GH_TOKEN: ${{ secrets.FINE_GRAIN_TOKEN }}
        run: |
          gh release view --repo "${{ github.repository }}" "${{ github.ref_name }}" \
            --json assets --jq '.assets[].browser_download_url' > asset_links.txt
          cat asset_links.txt

      - name: Format download message
        run: |
          LINKS=$(sort asset_links.txt)
          MESSAGE="**Dartotsu ${{ github.ref_name }} Downloads:**\n\n"
          while IFS= read -r LINK; do
            [[ -z "$LINK" ]] && continue
            if [[ $LINK == *"arm64"* ]]; then MESSAGE+="• [Android_arm64]($LINK)\n"
            elif [[ $LINK == *"armeabi"* ]]; then MESSAGE+="• [Android_armeabi-v7a]($LINK)\n"
            elif [[ $LINK == *"Android_x86"* ]]; then MESSAGE+="• [Android_x86_64]($LINK)\n"
            elif [[ $LINK == *"Android_Universal"* ]]; then MESSAGE+="• [Android_Universal]($LINK)\n"
            elif [[ $LINK == *"iOS"* ]]; then MESSAGE+="• [iOS]($LINK)\n"
            elif [[ $LINK == *"LinuxZip"* ]]; then MESSAGE+="• [Linux]($LINK)\n"
            elif [[ $LINK == *"Linux"* ]]; then MESSAGE+="• [Linux_AppImage]($LINK)\n"
            elif [[ $LINK == *"macos"* ]]; then MESSAGE+="• [macOS]($LINK)\n"
            elif [[ $LINK == *"Installer"* ]]; then MESSAGE+="• [Windows]($LINK)\n"
            fi
          done <<< "$LINKS"
          {
            echo "MESSAGE<<EOF"
            echo -e "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send download links to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASE_URL }}
          MESSAGE: ${{ env.MESSAGE }}
        run: bash scripts/ci/discord_release_links.sh
