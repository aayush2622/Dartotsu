name: Update Nix channels.json
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      alpha_version:
        description: Short commit SHA for the alpha channel
        required: false
        type: string
      alpha_url:
        description: Linux zip URL for the alpha channel
        required: false
        type: string
      alpha_hash:
        description: SRI hash of the unpacked alpha zip
        required: false
        type: string

jobs:
  update-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Fetch latest release zip per channel
        id: releases
        if: ${{ !github.event.inputs.alpha_url }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          fetch_zip_url() {
            local repo="$1" endpoint="$2"
            gh api "repos/$repo/$endpoint" --jq '
              (if type == "array" then .[0] else . end)
              | .assets[]? | select(.name | test("\\.zip$")) | .browser_download_url
            ' 2>/dev/null | head -n1
          }

          {
            echo "stable_url=$(fetch_zip_url aayush2622/Dartotsu releases/latest)"
            echo "prerelease_url=$(fetch_zip_url aayush2622/Dartotsu releases)"
          } >> "$GITHUB_OUTPUT"

      - name: Update channels.json
        env:
          ALPHA_VERSION: ${{ github.event.inputs.alpha_version }}
          ALPHA_URL: ${{ github.event.inputs.alpha_url }}
          ALPHA_HASH: ${{ github.event.inputs.alpha_hash }}
        run: |
          set -euo pipefail

          to_sri() {
            nix hash to-sri --type sha256 "$1" 2>/dev/null \
              || nix hash convert --hash-algo sha256 --to sri "$1"
          }

          update_channel() {
            local key="$1" url="$2"
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::warning::no .zip asset found for the $key channel, leaving channels.json untouched for it"
              return
            fi

            local version base32_hash hash tmp
            version="$(basename "$(dirname "$url")")"
            version="${version#v}"

            base32_hash="$(nix-prefetch-url --unpack --type sha256 "$url" 2>/dev/null | tail -n1)"
            hash="$(to_sri "$base32_hash")"

            tmp="$(mktemp)"
            jq --arg key "$key" --arg v "$version" --arg u "$url" --arg h "$hash" \
              '.[$key] = {version: $v, url: $u, hash: $h}' \
              channels.json > "$tmp"
            mv "$tmp" channels.json
          }

          if [ -n "${ALPHA_URL:-}" ] || [ -n "${ALPHA_VERSION:-}" ] || [ -n "${ALPHA_HASH:-}" ]; then
            if [ -z "${ALPHA_URL:-}" ] || [ -z "${ALPHA_VERSION:-}" ] || [ -z "${ALPHA_HASH:-}" ]; then
              echo "alpha update requires version, url, and hash" >&2
              exit 1
            fi
            case "$ALPHA_HASH" in
              sha256-*) ;;
              *)
                echo "alpha hash must be an SRI sha256 hash" >&2
                exit 1
                ;;
            esac
            tmp="$(mktemp)"
            jq --arg v "$ALPHA_VERSION" --arg u "$ALPHA_URL" --arg h "$ALPHA_HASH" \
              '.alpha = {version: $v, url: $u, hash: $h}' \
              channels.json > "$tmp"
            mv "$tmp" channels.json
          else
            update_channel stable "${{ steps.releases.outputs.stable_url }}"
            update_channel prerelease "${{ steps.releases.outputs.prerelease_url }}"
          fi

      - name: Verify the flake still builds
        run: nix flake check -L --accept-flake-config

      - name: Commit and push if channels.json changed
        run: |
          set -euo pipefail
          if git diff --quiet -- channels.json; then
            echo "channels.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git commit -m "chore: bump nix channels.json"
          git push origin HEAD:main
